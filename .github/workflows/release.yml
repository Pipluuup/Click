name: Release

# 打 v* 标签（如 v1.0.0）时自动打包并发布；也可在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compile check
        run: python -m py_compile main.py

      - name: Build executable with PyInstaller
        run: >
          python -m PyInstaller
          --onefile --windowed
          --name ClickApp
          --collect-all keyboard
          main.py

      - name: List build output
        run: dir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickApp-windows
          path: dist/*.exe

      - name: Rename exe with version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp dist/ClickApp.exe "dist/Click-${{ github.ref_name }}-win64.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Click 字母随机连发器 ${{ github.ref_name }}

            按任意字母键，随机打出 26 个大写字母（GUI 版）。

            - Windows 可执行文件：`Click-${{ github.ref_name }}-win64.exe`（免 Python 环境，双击即用）
            - 使用说明见仓库 [README.md](README.md)
          files: dist/*.exe
